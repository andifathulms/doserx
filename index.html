<!doctype html>
<html lang="id">
  <head>
    <!-- Dark mode is a manual, persisted choice (never OS-following — see
         index.css's dark-mode comment). This has to run synchronously, before
         any CSS paints, or a doctor who chose dark sees a flash of the light
         theme on every load. It reads the same localStorage key
         src/lib/storage.ts's loadTheme()/saveTheme() use, so the two can never
         disagree about which key holds the preference. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('doserx_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {}
      })()
    </script>
    <!-- title, description, canonical, OG and Twitter tags are generated
         from src/site.ts at build time — see metaTags() in vite.config.ts.
         Do not add copies here; that is what let them drift. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DoseRx" />
    <!-- There was no rel="icon" here at all, only apple-touch-icon, which is
         why the tab showed a blank page glyph. SVG for browsers that take it,
         32px PNG as the universal fallback. -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
